<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Camp - QR signes (A4)</title>
  <style>
    @page {
      size: A4 portrait;
      margin: 12mm;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", Tahoma, sans-serif;
      color: #111;
      background: #f4f4f4;
    }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      margin: 0 auto;
      padding: 12mm;
      background: #fff;
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 8mm;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.4px;
      margin: 0;
    }

    .subtitle {
      margin: 0;
      font-size: 13px;
      color: #444;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8mm;
      align-content: start;
    }

    .card {
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      padding: 6mm;
      display: grid;
      grid-template-rows: auto 1fr auto;
      justify-items: center;
      gap: 4mm;
      min-height: 120mm;
    }

    .label {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .qr {
      width: 65mm;
      height: 65mm;
      image-rendering: pixelated;
      border: 1px solid #eee;
      background: #fff;
      padding: 3mm;
    }

    .meta {
      margin: 0;
      font-size: 12px;
      color: #555;
    }

    @media print {
      body {
        background: #fff;
      }
      .sheet {
        margin: 0;
        width: auto;
        min-height: auto;
      }
    }
  </style>
</head>
<body>
  <main class="sheet">
    <h1 class="title">The Camp - QR signes</h1>
    <p class="subtitle">Planche A4 de test (enigmes E1 a E4)</p>

    <section class="grid" aria-label="QR enigmes">
      <article class="card">
        <h2 class="label">E1</h2>
        <img class="qr" src="e1.png" alt="QR signe enigme E1" />
        <p class="meta">Token: docs/qr-codes/e1.json</p>
      </article>

      <article class="card">
        <h2 class="label">E2</h2>
        <img class="qr" src="e2.png" alt="QR signe enigme E2" />
        <p class="meta">Token: docs/qr-codes/e2.json</p>
      </article>

      <article class="card">
        <h2 class="label">E3</h2>
        <img class="qr" src="e3.png" alt="QR signe enigme E3" />
        <p class="meta">Token: docs/qr-codes/e3.json</p>
      </article>

      <article class="card">
        <h2 class="label">E4</h2>
        <img class="qr" src="e4.png" alt="QR signe enigme E4" />
        <p class="meta">Token: docs/qr-codes/e4.json</p>
      </article>
    </section>
  </main>
</body>
</html>
