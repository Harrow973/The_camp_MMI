<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <base href="../../" />
  <title>The Camp — Remerciements</title>
  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/pages/progression/artefact2.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__vignette"></div>
    <div class="bg__grain"></div>
  </div>

  <div class="transition" aria-hidden="true">
    <div class="transition__black"></div>
  </div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="scene" role="application" aria-label="Remerciements du docteur">
    <header class="topbar">
      <div class="brand" aria-label="The Camp">
        <div class="brand__mark" aria-hidden="true">
          <!-- icône simple “croix médicale” -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z" fill="rgba(173,216,230,0.92)"/>
          </svg>
        </div>
        <div>
          <div class="brand__title">THE CAMP</div>
          <div class="brand__sub">Infirmerie — Récompense</div>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Docteur">
      <div class="stage__scan" aria-hidden="true"></div>
      <div class="stamp" id="stamp" aria-hidden="true">Récompense validée</div>
      <img class="doctor" id="doctorImg" src="img/phopital sourire.webp" alt="Docteur">
    </section>

    <section class="hud" id="hud" aria-label="Dialogue">
      <div class="hud__frame" aria-hidden="true"></div>

      <div class="hud__top">
        <div class="speaker" id="speakerName">Docteur</div>
        <div class="badge" id="badge">Infirmerie</div>
      </div>

      <div class="hud__text" id="dialogueText"></div>

      <div class="hud__bottom">
        <button class="btn" id="continueBtn" type="button">Continuer</button>
      </div>
    </section>
  </main>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script src="scripts/core/app-core.js"></script>

  <script src="scripts/pages/04-progression/artefact2.js"></script>

  
</body>
</html>
