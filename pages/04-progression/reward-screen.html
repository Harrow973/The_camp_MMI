<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <base href="../../" />
  <title>The Camp — Récompense !</title>
  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/pages/progression/reward-screen.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__vignette"></div>
    <div class="bg__grain"></div>
    <div class="scan"></div>
    <div class="sweep"></div>
  </div>

  <div class="transition" aria-hidden="true"><div class="transition__black"></div></div>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="scene" role="application" aria-label="Récompense">
    <header class="topbar">
      <div class="brand" aria-label="The Camp">
        <div class="brand__mark" aria-hidden="true">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M10 3h4v7h7v4h-7v7h-4v-7H3v-4h7V3z" fill="rgba(173,216,230,0.92)"/>
          </svg>
        </div>
        <div>
          <div class="brand__title">THE CAMP</div>
          <div class="brand__sub">Récompense — Artefact récupérable</div>
        </div>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Artefact">
      <canvas id="fx"></canvas>
      <div class="aura" aria-hidden="true"></div>
      <div class="plinth" aria-hidden="true"></div>

      <div class="artifactWrap" id="artifactWrap" aria-label="Toucher pour récupérer">
        <div class="halo" aria-hidden="true"></div>
        <img class="artifact" id="artifactImg" src="img/artifact2_icon.webp" alt="Artéfact 2">
      </div>
    </section>

    <section class="cta" id="cta" aria-label="Instruction">
      <div class="cta__frame" aria-hidden="true"></div>
      <div class="cta__row">
        <div>
          <div class="cta__title">Toucher pour récupérer <span class="hint">▾</span></div>
          <div class="cta__sub">Une collecte déclenche la validation et te renvoie vers la suite.</div>
        </div>
        <div class="badge" id="badge">INFIRMERIE</div>
        <button class="btn" id="collectBtn" type="button">Récupérer</button>
      </div>
    </section>
  </main>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <!-- SFX / Ambient (tu peux remplacer les src par tes fichiers) -->
  <audio id="sfxWhoosh" preload="auto">
    <source src="audio/chill.mp3" type="audio/mpeg">
  </audio>
  <audio id="sfxHum" preload="auto" loop>
    <source src="audio/chill.mp3" type="audio/mpeg">
  </audio>
  <audio id="sfxSparkle" preload="auto">
    <source src="audio/chill.mp3" type="audio/mpeg">
  </audio>
  <audio id="sfxBoom" preload="auto">
    <source src="audio/chill.mp3" type="audio/mpeg">
  </audio>
  <audio id="sfxClick" preload="auto">
    <source src="audio/chill.mp3" type="audio/mpeg">
  </audio>

  <script src="scripts/pages/04-progression/reward-screen.js"></script>
  <script src="scripts/core/app-core.js"></script>
  
</body>
</html>
