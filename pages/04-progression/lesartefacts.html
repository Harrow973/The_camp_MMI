<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <base href="../../" />
  <title>The Camp — Fusion des artéfacts</title>
  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/pages/progression/lesartefacts.css">
</head>

<body>
  <div class="bg" aria-hidden="true"><div class="grain"></div></div>

  <main class="app" role="application" aria-label="The Camp — Fusion des artéfacts">
    <header class="topbar">
      <div class="brand">
        <div class="title">THE CAMP</div>
        <div class="subtitle">Synchronisation — Artéfacts</div>
      </div>
      <div class="pill" aria-label="État">
        <span class="dot" aria-hidden="true"></span>
        <span id="statusText">NEXUS: STANDBY</span>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Chambre de fusion">
      <div class="scan" aria-hidden="true"></div>

      <div class="core" aria-hidden="true">
        <div class="ticks"></div>
        <div class="ring"></div>
      </div>

      <div class="orbitWrap" id="orbitWrap" aria-hidden="true">
        <div class="slot s1"><img class="art" id="a1" src="img/artifact1_icon.webp" alt="Artéfact 1"></div>
        <div class="slot s2"><img class="art" id="a2" src="img/artifact2_icon.webp" alt="Artéfact 2"></div>
        <div class="slot s3"><img class="art" id="a3" src="img/artifact3_icon.webp" alt="Artéfact 3"></div>
        <div class="slot s4"><img class="art" id="a4" src="img/artifact4_icon.webp" alt="Artéfact 4"></div>
      </div>

      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="shock" id="shock" aria-hidden="true"></div>
      <div class="glitch" id="glitch" aria-hidden="true"></div>
    </section>

    <section class="hud" aria-label="Console">
      <div class="hudTop">
        <div class="speaker" id="speaker">Système</div>
        <div class="badge" id="badge">Protocole NEXUS</div>
      </div>

      <div class="msg" id="msg">
        Quatre signatures détectées. Appuie pour initier l’assemblage.
      </div>

      <div class="btnRow">
        <button class="btn" id="startBtn" type="button">Démarrer</button>
        <button class="btn secondary is-ready" id="muteBtn" type="button">Son: ON</button>
      </div>
    </section>
  </main>

  <div class="loading" id="loading" aria-hidden="true">
    <div class="loadCard" role="dialog" aria-label="Chargement">
      <div class="loadTitle">Transfert — fin de mission</div>
      <div class="bar"><i id="barFill"></i></div>
      <div class="loadMeta">
        <span id="loadLeft">VERROUILLAGE</span>
        <span id="loadPct">0%</span>
      </div>
      <div class="hint" id="loadHint">
        Stabilisation du noyau… Ne quitte pas l’écran.
      </div>
    </div>
  </div>

  <script src="scripts/pages/04-progression/lesartefacts.js"></script>
  <script src="scripts/core/app-core.js"></script>
  
</body>
</html>
