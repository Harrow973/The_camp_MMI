<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <base href="../../" />
  <title>The Camp — Dialogue</title>

  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/pages/story/dialogue.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__vignette"></div>
    <div class="bg__grain"></div>
  </div>

  <div class="transition" aria-hidden="true">
    <div class="transition__black"></div>
  </div>

  <main class="scene" id="scene">
    <header class="topbar">
      <button class="chip" id="backBtn" type="button">← Retour</button>

      <div class="brand" aria-label="The Camp">
        <img src="img/logotc.webp" alt="Logo The Camp">
        <div>
          <div class="brand__title">THE CAMP</div>
          <div class="brand__sub">Briefing — Dialogue</div>
        </div>
      </div>

      <div style="width: 88px;"></div>
    </header>

    <section class="stage" aria-label="Personnage">
      <div class="stage__scan" aria-hidden="true"></div>
      <img class="character" id="characterImage" src="img/profneutre.webp" alt="Professeur Tony">
    </section>

    <section class="hud" id="hud" aria-label="Dialogue">
      <div class="hud__frame" aria-hidden="true"></div>

      <div class="hud__top">
        <div class="speaker" id="speakerName">Professeur Tony</div>
        <div class="tag" id="sceneTag">Briefing initial</div>
      </div>

      <div class="hud__text" id="dialogueText"></div>

      <div class="hud__bottom">

        <div class="cta">
          <div class="tap" id="tapHint">
            <span class="tap__dot" aria-hidden="true"></span>
            <span>Connecté</span>
          </div>
          <button class="btn" id="continueBtn" type="button">Continuer</button>
        </div>
      </div>
    </section>
  </main>

  <div class="loader" id="loader" aria-hidden="true">
    <div class="spinner" aria-hidden="true"></div>
  </div>

  <script src="scripts/core/app-core.js"></script>

  <script src="scripts/pages/01-story/dialogue.js"></script>
</body>
</html>
