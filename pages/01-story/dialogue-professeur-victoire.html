<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <base href="../../" />
  <title>The Camp — Victoire</title>
  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/pages/story/dialogue-professeur-victoire.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__vignette"></div>
    <div class="bg__grain"></div>
  </div>

  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="fadeBlack" aria-hidden="true"></div>

  <main class="scene" role="application" aria-label="Dialogue — Professeur (victoire)">
    <header class="topbar">
      <div class="brand" aria-label="The Camp">
        <img src="img/logotc.webp" alt="Logo The Camp">
        <div>
          <div class="brand__title">THE CAMP</div>
          <div class="brand__sub">Débrief — Victoire</div>
        </div>
      </div>
    </header>

    <section class="stage shakeTarget" id="stage" aria-label="Professeur">
      <div class="stage__scan" aria-hidden="true"></div>
      <div class="stamp" id="stamp" aria-hidden="true">Mission accomplie</div>
      <img class="prof" id="profImg" src="img/profsourir.webp" alt="Professeur">
    </section>

    <section class="hud shakeTarget" id="hud" aria-label="Dialogue">
      <div class="hud__frame" aria-hidden="true"></div>

      <div class="hud__top">
        <div class="speaker" id="speakerName">Professeur</div>
        <div class="badge" id="badge">Retour au camp</div>
      </div>

      <div class="hud__text" id="dialogueText"></div>

      <div class="hud__bottom">
        <button class="btn" id="continueBtn" type="button">Continuer</button>
      </div>
    </section>
  </main>

  <script src="scripts/pages/01-story/dialogue-professeur-victoire.js"></script>
  <script src="scripts/core/app-core.js"></script>
  
</body>
</html>
