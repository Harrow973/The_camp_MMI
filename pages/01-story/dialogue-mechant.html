<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <base href="../../" />
  <title>The Camp — Première apparition</title>
  <link rel="icon" type="image/webp" href="img/artifact1_icon.webp">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="styles/tokens.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Orbitron:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/pages/story/dialogue-mechant.css">
</head>

<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__image" id="bgImage"></div>
    <div class="bg__vignette"></div>
    <div class="bg__grain"></div>
  </div>

  <div class="crt" aria-hidden="true"></div>
  <div class="flash" id="flash" aria-hidden="true"></div>
  <div class="fadeBlack" aria-hidden="true"></div>

  <main class="scene" role="application" aria-label="The Camp — Apparition du méchant">
    <header class="topbar">
      <div class="brand">
        <div class="brand__title">THE CAMP</div>
        <div class="brand__sub">Intrusion — Signal inconnu</div>
      </div>

      <div class="pill" aria-label="État système">
        <span class="dot" aria-hidden="true"></span>
        <span id="sysState">SYSTÈME: STABLE</span>
      </div>
    </header>

    <section class="stage shakeTarget" id="stage" aria-label="Zone de confrontation">
      <div class="stamp" id="stamp" aria-hidden="true">INTRUSION DÉTECTÉE</div>
      <div class="portal" id="portal" aria-hidden="true"></div>
      <div class="scan" aria-hidden="true"></div>

      <div class="villainWrap" id="villainWrap" aria-label="Le méchant">
        <img class="villain" id="villainImg" src="img/mechant.webp" alt="Le Méchant">
        <div class="glitchLayer" id="glitchA" aria-hidden="true">
          <img id="glitchAImg" src="img/mechant.webp" alt="">
        </div>
        <div class="glitchLayer" id="glitchB" aria-hidden="true" style="mix-blend-mode: hard-light; opacity:.0;">
          <img id="glitchBImg" src="img/mechant.webp" alt="">
        </div>
        <div class="corrupt" aria-hidden="true"></div>
      </div>
    </section>

    <section class="hud shakeTarget" id="hud" aria-label="Dialogue">
      <div class="hudTop">
        <div class="speaker" id="speakerName">???</div>
        <div class="badge" id="badge">Canal inconnu</div>
      </div>

      <div class="hudText" id="dialogueText"></div>
      <div class="subHint" id="subHint">Astuce: touche l’écran pour accélérer.</div>

      <div class="hudBottom">
        <button class="btn" id="continueBtn" type="button">Continuer</button>
      </div>
    </section>
  </main>

  <script src="scripts/pages/01-story/dialogue-mechant.js"></script>
  <script src="scripts/core/app-core.js"></script>
  
</body>
</html>
